name: "AI Knight Online - Build Client"

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-ai-knight-client.yml'
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'Game server address'
        required: false
        default: 'game.ai-nexus.net'
      server_port:
        description: 'Game server port'
        required: false
        default: '15000'

concurrency:
  group: "ai-knight-${{ github.ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: "Build AI Knight Client (x64 Release)"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'false'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DOPENKO_BUILD_CLIENT=ON -DOPENKO_BUILD_CLIENT_TOOLS=ON -DOPENKO_BUILD_SERVERS=OFF -DOPENKO_BUILD_TOOLS=OFF -DOPENKO_BUILD_TESTS=OFF -DOPENKO_FETCH_CLIENT_ASSETS=TRUE

    - name: Build Client
      shell: pwsh
      run: cmake --build build --config Release --parallel

    - name: Prepare Distribution
      shell: pwsh
      run: |
        $distDir = "AI_Knight_Online_Client"
        New-Item -ItemType Directory -Force -Path $distDir

        if (Test-Path "build/bin") {
          Copy-Item "build/bin/*" -Destination $distDir -Recurse -Force
          Write-Host "Copied from build/bin"
        }
        if (Test-Path "build/bin/Release") {
          Copy-Item "build/bin/Release/*" -Destination $distDir -Recurse -Force
          Write-Host "Copied from build/bin/Release"
        }
        if (Test-Path "build/ClientData") {
          Copy-Item "build/ClientData/*" -Destination "$distDir/Data" -Recurse -Force
          Write-Host "Copied ClientData"
        }

        $serverIp = "${{ github.event.inputs.server_ip }}"
        $serverPort = "${{ github.event.inputs.server_port }}"
        if ([string]::IsNullOrEmpty($serverIp)) { $serverIp = "game.ai-nexus.net" }
        if ([string]::IsNullOrEmpty($serverPort)) { $serverPort = "15000" }

        $serverIni = "[Server]`r`nIP=$serverIp`r`nPort=$serverPort`r`n`r`n[Info]`r`nServerName=AI Knight Online`r`nWebsite=https://ko.ai-nexus.net"
        $serverIni | Out-File -FilePath "$distDir/server.ini" -Encoding ascii

        $launcher = "@echo off`r`ntitle AI Knight Online`r`necho Starting AI Knight Online...`r`necho Server: ${serverIp}:${serverPort}`r`nstart KnightOnLine.exe"
        $launcher | Out-File -FilePath "$distDir/Play_AI_Knight.bat" -Encoding ascii

        $readme = "AI Knight Online Client`r`n`r`nServer: ${serverIp}:${serverPort}`r`nWebsite: https://ko.ai-nexus.net`r`n`r`nRun Play_AI_Knight.bat to start the game.`r`n`r`nBuild: ${{ github.sha }}"
        $readme | Out-File -FilePath "$distDir/README.txt" -Encoding ascii

        Write-Host "Distribution contents:"
        Get-ChildItem $distDir -Recurse

    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Knight-Online-Client-x64
        path: AI_Knight_Online_Client/
        retention-days: 90
        if-no-files-found: error
