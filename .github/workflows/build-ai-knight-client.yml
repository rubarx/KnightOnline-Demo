# AI Knight Online - Client Build & Package Workflow
# Compiles the Knight Online client and creates downloadable artifacts

name: "AI Knight Online - Build Client"

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-ai-knight-client.yml'
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'Game server address'
        required: false
        default: 'game.ai-nexus.net'
      server_port:
        description: 'Game server port'
        required: false
        default: '15000'

concurrency:
  group: "ai-knight-${{ github.ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: "Build AI Knight Client (x64 Release)"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'false'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake & Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . `
          -B build `
          -G "Ninja" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENKO_BUILD_CLIENT=ON `
          -DOPENKO_BUILD_CLIENT_TOOLS=ON `
          -DOPENKO_BUILD_SERVERS=OFF `
          -DOPENKO_BUILD_TOOLS=OFF `
          -DOPENKO_BUILD_TESTS=OFF `
          -DOPENKO_FETCH_CLIENT_ASSETS=TRUE

    - name: Build Client
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Prepare Distribution
      shell: pwsh
      run: |
        $distDir = "AI_Knight_Online_Client"
        New-Item -ItemType Directory -Force -Path $distDir

        # Copy all built binaries
        if (Test-Path "build/bin") {
          Copy-Item "build/bin/*" -Destination $distDir -Recurse -Force
          Write-Host "Copied from build/bin"
        }
        if (Test-Path "build/bin/Release") {
          Copy-Item "build/bin/Release/*" -Destination $distDir -Recurse -Force
          Write-Host "Copied from build/bin/Release"
        }

        # Copy client data if exists
        if (Test-Path "build/ClientData") {
          Copy-Item "build/ClientData/*" -Destination "$distDir/Data" -Recurse -Force
          Write-Host "Copied ClientData"
        }

        # Create server configuration
        $serverIp = "${{ github.event.inputs.server_ip || 'game.ai-nexus.net' }}"
        $serverPort = "${{ github.event.inputs.server_port || '15000' }}"

        @"
[Server]
IP=$serverIp
Port=$serverPort

[Info]
ServerName=AI Knight Online
Website=https://ko.ai-nexus.net
"@ | Out-File -FilePath "$distDir/server.ini" -Encoding ascii -NoNewline

        # Create launcher
        @"
@echo off
title AI Knight Online
echo ========================================
echo    AI Knight Online
echo    Server: $serverIp`:$serverPort
echo ========================================
echo.
echo Starting game...
start "" "KnightOnLine.exe"
"@ | Out-File -FilePath "$distDir/Play_AI_Knight.bat" -Encoding ascii

        # Create README
        @"
========================================
  AI Knight Online Client
========================================

Server: $serverIp
Port: $serverPort
Website: https://ko.ai-nexus.net

HOW TO PLAY:
1. Run Play_AI_Knight.bat
2. Or run KnightOnLine.exe directly

REQUIREMENTS:
- Windows 10/11 64-bit
- DirectX 9.0c
- Visual C++ Redistributable 2022

Build: ${{ github.sha }}
Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')
"@ | Out-File -FilePath "$distDir/README.txt" -Encoding ascii

        Write-Host ""
        Write-Host "=== Distribution Contents ==="
        Get-ChildItem $distDir -Recurse | Format-Table Name, Length -AutoSize

    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Knight-Online-Client-x64
        path: AI_Knight_Online_Client/
        retention-days: 90
        if-no-files-found: error
