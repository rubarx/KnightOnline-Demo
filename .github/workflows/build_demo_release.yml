# Build and package Knight Online Demo Client with Auto-Update Launcher
name: "Build Demo Release"

on:
  push:
    branches:
    - demo
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: "Build Demo Client (Release x64)"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build Launcher executable
      shell: pwsh
      run: |
        cd launcher/src
        pyinstaller --onefile --windowed --name "KO-Demo-Launcher" demo_launcher.py
        Write-Host "Launcher built successfully"
        Get-Item "dist/KO-Demo-Launcher.exe" | Select-Object Name, Length

    - name: Build Standalone Installer
      shell: pwsh
      run: |
        cd installer
        pyinstaller --onefile --windowed --name "KO-Demo-Setup" KO-Demo-Installer.py
        Write-Host "Installer built successfully"
        Get-Item "dist/KO-Demo-Setup.exe" | Select-Object Name, Length

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build client (Release x64)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration="Release" /p:Platform="x64" Client.slnx

    - name: Create Demo Package
      shell: pwsh
      run: |
        # Create package directory
        New-Item -ItemType Directory -Force -Path "KnightOnline-Demo"

        # Copy executable
        Copy-Item "bin/Release-x64/KnightOnLine.exe" "KnightOnline-Demo/"

        # Copy auto-update launcher
        Copy-Item "launcher/src/dist/KO-Demo-Launcher.exe" "KnightOnline-Demo/"

        # Copy required DLLs if any exist
        if (Test-Path "bin/Release-x64/*.dll") {
          Copy-Item "bin/Release-x64/*.dll" "KnightOnline-Demo/"
        }

        # Copy client assets
        if (Test-Path "assets/Client") {
          Copy-Item -Recurse "assets/Client/*" "KnightOnline-Demo/"
        }

        # Create Server.ini with configurable server IP
        @"
[Server]
Count=1
IP0=game.ko-demo.net

[Version]
Files=1299

[Join]
Registration site=https://github.com/rubarx/KnightOnline-Demo
"@ | Out-File -FilePath "KnightOnline-Demo/Server.ini" -Encoding ASCII

        # Create Options.ini default config
        @"
[Video]
Width=1024
Height=768
Windowed=0
ColorDepth=32
TextureLevel=0
TexQuality=1
TextureLOD=1
Fog=0
ViewDist=1200.000000
MipMapping=1
AlphaFog=0
NearPlane=0.300000
FarPlane=1500.000000
LightFOV=50.000000
LightBrightness=100

[Sound]
SndEnable=1
SndVolume=100
MscEnable=1
MscVolume=100
3DSound=1
DuplicateEnable=1

[System]
Language=0
AutoShutdown=0
Chat=11111111
MouseSpeed=50
ChatFilter=0
SkillEffect=1
"@ | Out-File -FilePath "KnightOnline-Demo/Options.ini" -Encoding ASCII

        # Create simple launcher batch file
        @"
@echo off
title Knight Online Demo
echo ==========================================
echo   Knight Online Demo Client
echo   Custom Features for Demo Version
echo ==========================================
echo.
echo CONTROLS:
echo   G          - Instant Town Teleport
echo   Insert     - Toggle Auto-Pot (HP/MP)
echo   Numpad 1-6 - Skill Macros
echo   1-0        - 10 Skill Slots
echo.
echo AUTO-POT SETTINGS:
echo   HP Threshold: 50%%
echo   MP Threshold: 30%%
echo   Cooldown: 1 second
echo.
echo Starting game...
start "" "KnightOnLine.exe"
"@ | Out-File -FilePath "KnightOnline-Demo/Launch-Demo.bat" -Encoding ASCII

        # Create README
        @"
Knight Online Demo Client
=========================

INSTALLATION:
1. Extract to any folder
2. Run KO-Demo-Launcher.exe (recommended, auto-updates)
   OR run KnightOnLine.exe directly

CUSTOM FEATURES:

[Town Teleport - Press G]
Instantly teleports you to town via /town command.
Works anywhere (unless in trade).

[Auto-Pot System - Press Insert]
Automatically uses HP/MP potions when low.
- HP Threshold: 50% (uses potion when HP drops below 50%)
- MP Threshold: 30% (uses potion when MP drops below 30%)
- Cooldown: 1 second between uses
- Supports all standard potions by ID and name detection

[Skill Macros - Numpad 1-6]
Pre-configured skill combos:
- Numpad 1: Mage Ice Combo
- Numpad 2: Mage Fire Combo
- Numpad 3: Mage Lightning Combo
- Numpad 4: Archer Burst Combo
- Numpad 5: Rogue Assassination Combo
- Numpad 6: Warrior Basic Combo

[Extended Hotkeys]
10 skill slots (keys 1-0) instead of standard 8.

SERVER CONFIGURATION:
Edit Server.ini to change the server IP:
- IP0 = your server address

GitHub: https://github.com/rubarx/KnightOnline-Demo
Built with OpenKO (Open Source Knight Online)
"@ | Out-File -FilePath "KnightOnline-Demo/README.txt" -Encoding UTF8

        # List package contents
        Write-Host "Package contents:"
        Get-ChildItem -Recurse "KnightOnline-Demo" | Select-Object FullName

    - name: Create ZIP Archive
      shell: pwsh
      run: |
        Compress-Archive -Path "KnightOnline-Demo/*" -DestinationPath "KnightOnline-Demo-x64.zip" -Force
        Write-Host "Created: KnightOnline-Demo-x64.zip"
        Get-Item "KnightOnline-Demo-x64.zip" | Select-Object Name, Length

    - name: Upload Demo Package
      uses: actions/upload-artifact@v4
      with:
        name: KnightOnline-Demo-x64
        path: KnightOnline-Demo-x64.zip
        retention-days: 30

    - name: Upload Standalone Installer
      uses: actions/upload-artifact@v4
      with:
        name: KO-Demo-Setup
        path: installer/dist/KO-Demo-Setup.exe
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          KnightOnline-Demo-x64.zip
          installer/dist/KO-Demo-Setup.exe
        body: |
          ## Knight Online Demo Client

          ### Downloads
          - **KO-Demo-Setup.exe** (12 MB) - Standalone installer, downloads everything automatically
          - **KnightOnline-Demo-x64.zip** (335 MB) - Full package with launcher included

          ### Custom Features
          - **Town Button** (G): Quick teleport to town with /town command
          - **Auto-Pot** (Insert): Automatic HP/MP potion usage
          - **Skill Macros** (Numpad 1-6): Pre-configured skill combos
          - **Extended Hotkeys**: 10 skill slots (keys 1-0)

          ### Installation
          **Option 1 - Installer (Recommended):**
          1. Download `KO-Demo-Setup.exe`
          2. Run it and choose install location
          3. The installer downloads and sets up everything

          **Option 2 - Manual:**
          1. Download and extract `KnightOnline-Demo-x64.zip`
          2. Run `KO-Demo-Launcher.exe`

          ### Requirements
          - Windows 10/11 (64-bit)
          - DirectX 9.0c
