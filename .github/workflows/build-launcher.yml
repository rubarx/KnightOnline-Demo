name: "AI Knight Online - Build Launcher"

on:
  push:
    branches: [master, main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: "Build Launcher (Windows)"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pyinstaller

    - name: Build Launcher
      shell: pwsh
      run: |
        cd launcher
        pyinstaller --onefile --windowed --name AI_Knight_Online_Launcher --noupx --noconsole --clean --noconfirm src/launcher.py

    - name: Upload Launcher Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Knight-Online-Launcher
        path: launcher/dist/AI_Knight_Online_Launcher.exe
        retention-days: 90
